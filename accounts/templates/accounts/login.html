
{% extends "accounts/base.html" %}

{% block title %}Login | User Access Management{% endblock %}

{% block content %}
<div class="panel" style="max-width: 440px; margin: 50px auto;">
    <h1>Sign in</h1>
    <p>Sign in to User & Access Management.</p>

    {% if form.errors %}
        <p style="color: #dc2626;">
            Invalid username or password. Please try again.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label for="id_username">Username</label>
            <input id="id_username" name="username"
                   type="text" required autofocus
                   style="display:block; width:100%; padding:10px;">
        </div>

        <div style="margin-bottom: 16px;">
            <label for="id_password">Password</label>
            <input id="id_password" name="password"
                   type="password" required
                   style="display:block; width:100%; padding:10px;">
        </div>

        <button class="button" type="submit">Log in</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
